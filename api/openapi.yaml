openapi: 3.0.0
info:
  contact:
    email: stelzo@steado.de
    name: Survival
    url: https://discord.gg/3EtHskZD8h
  description: "# Open Ankama Developer Community\nThe all-in-one toolbelt for your\
    \ next Ankama related project.\n\n## Versions\n- [Dofus 2](https://docs.dofusdu.de/dofus2/)\n\
    - [Dofus 3](https://docs.dofusdu.de/dofus3/)\n  - v1.1.0 beta [preview] (you are\
    \ here) \n\n## Client SDKs\n- [Javascript](https://github.com/dofusdude/dofusdude-js)\
    \ `npm i dofusdude-js@beta --save`\n- [Typescript](https://github.com/dofusdude/dofusdude-ts)\
    \ `npm i dofusdude-ts@beta --save`\n- [Go](https://github.com/dofusdude/dodugo)\
    \ `go get github.com/dofusdude/dodugo@v1.1.0-beta.1`\n- [Python](https://github.com/dofusdude/dofusdude-py)\
    \ `pip install --pre dofusdude`\n- [Java](https://github.com/dofusdude/dofusdude-java)\
    \ Maven with GitHub packages setup\n\nEverything, including this site, is generated\
    \ out of the [Docs Repo](https://github.com/dofusdude/api-docs). Consider it the\
    \ Single Source of Truth. If there is a problem with the SDKs, create an issue\
    \ there.\n\nYour favorite language is missing? Please let me know!\n\n# Main Features\n\
    - 🥷 **Seamless Auto-Update** load data in the background when a new Dofus version\
    \ is released and serving it within 10 minutes with atomic data source switching.\
    \ No downtime and no effects for the user, just always up-to-date.\n\n- ⚡ **Blazingly\
    \ Fast** all data in-memory, aggressive caching over short time spans, HTTP/2\
    \ multiplexing, written in Go, optimized for low latency, hosted on bare metal\
    \ in 🇩🇪.\n\n- 📨 **Almanax Discord Integration** Use the endpoints as a dev\
    \ or the official [Web Client](https://discord.dofusdude.com) as a user.\n\n-\
    \ 🩸 **Dofus 3 Beta** from stable to bleeding edge by replacing /dofus3 with /dofus3beta.\n\
    \n- 🗣️ **Multilingual** supporting _en_, _fr_, _es_, _pt_, _de_.\n\n- 🧠 **Search\
    \ by Relevance** allowing typos in name and description, handled by language specific\
    \ text analysis and indexing.\n\n- 🕵️ **Official Sources** generated from actual\
    \ data from the game.\n\n... and much more on the Roadmap on my [Discord](https://discord.gg/3EtHskZD8h).\n"
  license:
    name: GPL-3.0
    url: https://github.com/dofusdude/doduapi/blob/main/LICENSE
  title: DoduAPI software beta
  version: 1.1.0-beta.1
servers:
- description: Software beta API
  url: https://beta.api.dofusdu.de
tags:
- description: "Classes, spells, monsters, and the world-area hierarchy"
  name: game data
- description: The Dofus Almanax
  name: almanax
- description: Consumable Items
  name: consumables
- description: Cosmetic Equipment
  name: cosmetics
- description: Weapons and Equipment
  name: equipment
- description: General Overview Endpoints
  name: game
- description: Metadata for using the API more efficiently
  name: meta
- description: Mounts
  name: mounts
- description: Quest Items
  name: quest items
- description: Resources
  name: resources
- description: Sets
  name: sets
- description: Actively calling you for updates for various events
  name: webhooks
paths:
  /{game}/v1/{language}/items/search:
    get:
      description: Search in all names and descriptions of Dofus items (including
        all subtypes) with a query.
      operationId: get-items-all-search
      parameters:
      - description: a valid language code
        explode: false
        in: path
        name: language
        required: true
        schema:
          enum:
          - en
          - fr
          - de
          - es
          - pt
          example: fr
          maxLength: 2
          minLength: 2
          type: string
        style: simple
      - description: game main 'dofus3' or beta channel 'dofus3beta'
        explode: false
        in: path
        name: game
        required: true
        schema:
          enum:
          - dofus3
          - dofus3beta
          example: dofus3
          type: string
        style: simple
      - description: case sensitive search query
        explode: true
        in: query
        name: query
        required: true
        schema:
          example: atcham
          type: string
        style: form
      - description: only results which level is equal or above this value
        explode: true
        in: query
        name: "filter[min_level]"
        required: false
        schema:
          example: 190
          format: int32
          maximum: 200
          minimum: 0
          type: integer
        style: form
      - description: only results which level is equal or below this value
        explode: true
        in: query
        name: "filter[max_level]"
        required: false
        schema:
          example: 200
          format: int32
          maximum: 200
          minimum: 0
          type: integer
        style: form
      - description: maximum number of returned results
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 8
          example: 8
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: multi-filter results with the english type name. Add with "wood"
          or "+wood" and exclude with "-wood".
        explode: false
        in: query
        name: "filter[type.name_id]"
        required: false
        schema:
          example:
          - boots
          items:
            type: string
          type: array
          uniqueItems: true
        style: form
      responses:
        "200":
          content:
            application/json:
              examples: {}
              schema:
                items:
                  $ref: "#/components/schemas/ListItemGeneral"
                type: array
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
      summary: Search All Items
      tags:
      - game
      x-stoplight:
        id: eeoi1h7wagrmw
