  /dofus3/v1/{language}/almanax:
    get:
      description: "Get a range of dates, defaults to today + 6 following days but\
        \ can specified by the query parameters. \n\nfilter[bonus_type] can be used\
        \ seperately and does not have an effect on the other parameters.\n\nrange[from]\
        \ changes the start date, everything else defaults to 6 following dates from\
        \ this start date.\n\nrange[to] when used without anything else, it will use\
        \ today as start date and this parameter as end. All ranges are inclusive.\n\
        \nrange[from] + range[to] = inclusive range over the specified dates, should\
        \ never be farther apart than 35 days.\n\nrange[from|to] + range[size] no\
        \ need to specify the date, just following days with [from] (0 is today) or\
        \ go backwards in time with only [to] and [size].\n\nNot all combinations\
        \ are listed but this should give you an idea how to they could work."
      operationId: get-almanax-range
      parameters:
      - description: code
        explode: false
        in: path
        name: language
        required: true
        schema:
          enum:
          - en
          - fr
          - de
          - es
          - pt
          example: fr
          type: string
        style: simple
      - description: "Optional bonus ID from meta/{language}/almanax/bonuses. Restricts\
          \ the selected date range and can produce no results when that bonus does\
          \ not occur in the range."
        explode: true
        in: query
        name: "filter[bonus_type]"
        required: false
        schema:
          type: string
        style: form
      - description: yyyy-mm-dd
        explode: true
        in: query
        name: "range[from]"
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: yyyy-mm-dd
        explode: true
        in: query
        name: "range[to]"
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Size of the returned range. Disable to fully use the range by
          setting size to -1.
        explode: true
        in: query
        name: "range[size]"
        required: false
        schema:
          example: -1
          format: int32
          maximum: 370
          type: integer
        style: form
      - description: "determine what the current time is. If you live in Brazil, \"\
          today\" will be hours apart from Paris. Use your timezone to get results\
          \ relative to your location."
        explode: true
        in: query
        name: timezone
        required: false
        schema:
          default: Europe/Paris
          example: Europe/Paris
          type: string
        style: form
      - description: character level for the reward_xp field
        explode: true
        in: query
        name: level
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples: {}
              schema:
                items:
                  $ref: "#/components/schemas/Almanax"
                type: array
          description: ""
      summary: Almanax Range
      tags:
      - almanax
      x-stoplight:
        id: fy8l7o3sz1jyo
