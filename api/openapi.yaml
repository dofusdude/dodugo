components:
  parameters:
    Game:
      explode: false
      in: path
      name: game
      required: true
      schema:
        enum:
        - dofus3
        - dofus3beta
        type: string
      style: simple
    Language:
      explode: false
      in: path
      name: language
      required: true
      schema:
        enum:
        - en
        - fr
        - de
        - es
        - pt
        type: string
      style: simple
    PageNumber:
      explode: true
      in: query
      name: "page[number]"
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    PageSize:
      explode: true
      in: query
      name: "page[size]"
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
      style: form
    MonsterSpellInclude:
      description: Optional spell expansion for monster responses. Leave include unset
        to return spell URLs. Use `spells.grade` to embed the assigned spell grade.
        Use `spells` to embed every available grade of each assigned spell.
      explode: true
      in: query
      name: include
      required: false
      schema:
        enum:
        - spells.grade
        - spells
        type: string
      style: form
  schemas:
    MappedEntityListEntry:
      description: Compact collection summary. A missing detail field here does not
        mean the resource lacks that data. Request the single-record endpoint or the
        collection's full fields to obtain details.
      example:
        ankama_id: 0
        name: name
        image_urls:
          icon: icon
          sd: sd
          hq: hq
          hd: hd
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        image_urls:
          $ref: "#/components/schemas/Images"
      required:
      - ankama_id
      - name
      type: object
    MappedEntityCollection:
      description: The populated array property matches the selected resource.
      example:
        classes:
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        spells:
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        monsters:
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        super_areas:
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        - ankama_id: 0
          name: name
          image_urls:
            icon: icon
            sd: sd
            hq: hq
            hd: hd
        areas:
        - null
        - null
        subareas:
        - null
        - null
        _links:
          key: ""
      properties:
        classes:
          items:
            $ref: "#/components/schemas/MappedEntityCollection_classes_inner"
          type: array
        spells:
          items:
            $ref: "#/components/schemas/MappedEntityCollection_spells_inner"
          type: array
        monsters:
          items:
            $ref: "#/components/schemas/MappedEntityCollection_monsters_inner"
          type: array
        super_areas:
          items:
            $ref: "#/components/schemas/MappedEntityCollection_super_areas_inner"
          type: array
        areas:
          items:
            $ref: "#/components/schemas/MappedEntityCollection_super_areas_inner"
          type: array
        subareas:
          items:
            $ref: "#/components/schemas/MappedEntityCollection_super_areas_inner"
          type: array
        _links:
          additionalProperties: true
          type: object
      type: object
    CombatReference:
      additionalProperties: true
      description: "A compact resolved reference, not a complete resource. Interpret\
        \ the ID in the context of the containing field. IDs in different resource\
        \ types can have the same numeric value without referring to the same entity."
      example:
        ankama_id: 6
        name: name
        kind: kind
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        kind:
          type: string
      type: object
    CombatCondition:
      additionalProperties: true
      example:
        operator: operator
        negated: true
        subject: subject
        reference:
          ankama_id: 6
          name: name
          kind: kind
      properties:
        operator:
          type: string
        negated:
          type: boolean
        subject:
          type: string
        reference:
          $ref: "#/components/schemas/CombatReference"
      type: object
    TargetSelector:
      additionalProperties: true
      example:
        kind: kind
        code: code
        name: name
        description: description
        subject: subject
        negated: true
        reference:
          ankama_id: 6
          name: name
          kind: kind
        conditions:
        - operator: operator
          negated: true
          subject: subject
          reference:
            ankama_id: 6
            name: name
            kind: kind
        - operator: operator
          negated: true
          subject: subject
          reference:
            ankama_id: 6
            name: name
            kind: kind
      properties:
        kind:
          description: Human-readable target category or relationship.
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        subject:
          type: string
        negated:
          type: boolean
        reference:
          $ref: "#/components/schemas/CombatReference"
        conditions:
          items:
            $ref: "#/components/schemas/CombatCondition"
          type: array
      type: object
    TargetMask:
      description: Determines who an effect may affect. Combine the resolved selectors
        and conditions using logic. This is distinct from the zone geometry and from
        the event that triggers the effect.
      example:
        raw: raw
        logic: logic
        conditions:
        - operator: operator
          negated: true
          subject: subject
          reference:
            ankama_id: 6
            name: name
            kind: kind
        - operator: operator
          negated: true
          subject: subject
          reference:
            ankama_id: 6
            name: name
            kind: kind
        selectors:
        - kind: kind
          code: code
          name: name
          description: description
          subject: subject
          negated: true
          reference:
            ankama_id: 6
            name: name
            kind: kind
          conditions:
          - operator: operator
            negated: true
            subject: subject
            reference:
              ankama_id: 6
              name: name
              kind: kind
          - operator: operator
            negated: true
            subject: subject
            reference:
              ankama_id: 6
              name: name
              kind: kind
        - kind: kind
          code: code
          name: name
          description: description
          subject: subject
          negated: true
          reference:
            ankama_id: 6
            name: name
            kind: kind
          conditions:
          - operator: operator
            negated: true
            subject: subject
            reference:
              ankama_id: 6
              name: name
              kind: kind
          - operator: operator
            negated: true
            subject: subject
            reference:
              ankama_id: 6
              name: name
              kind: kind
      properties:
        raw:
          description: Original game mask retained for lossless debugging.
          type: string
        logic:
          type: string
        conditions:
          items:
            $ref: "#/components/schemas/CombatCondition"
          type: array
        selectors:
          items:
            $ref: "#/components/schemas/TargetSelector"
          type: array
      required:
      - raw
      - selectors
      type: object
    SpellTrigger:
      additionalProperties: true
      example:
        kind: kind
        code: code
        name: name
        description: description
        subject: subject
        reference:
          ankama_id: 6
          name: name
          kind: kind
      properties:
        kind:
          description: Resolved event that activates the effect.
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        subject:
          type: string
        reference:
          $ref: "#/components/schemas/CombatReference"
      type: object
    SpellTriggers:
      description: Determines when an effect activates. Events are not additional
        effects to apply unconditionally. Use logic with the resolved event names
        and descriptions instead of parsing raw tokens.
      example:
        raw: raw
        logic: logic
        events:
        - kind: kind
          code: code
          name: name
          description: description
          subject: subject
          reference:
            ankama_id: 6
            name: name
            kind: kind
        - kind: kind
          code: code
          name: name
          description: description
          subject: subject
          reference:
            ankama_id: 6
            name: name
            kind: kind
      properties:
        raw:
          description: Original trigger tokens retained for lossless debugging.
          type: string
        logic:
          type: string
        events:
          items:
            $ref: "#/components/schemas/SpellTrigger"
          type: array
      required:
      - events
      - raw
      type: object
    ZoneShape:
      example:
        code: code
        name: name
      properties:
        code:
          type: string
        name:
          description: "Resolved shape name, such as point, circle, cross, line, or\
            \ cone."
          type: string
      required:
      - code
      - name
      type: object
    EffectZone:
      description: "Combat-cell area for this effect or activation context, not a\
        \ geographic world area. Shape, size and inner size describe geometry. Actual\
        \ affected cells can depend on position, direction and fight state. Each spell\
        \ effect can have a different zone."
      example:
        raw: raw
        shape:
          code: code
          name: name
        size: 7
        min_size: 1
        cell_ids:
        - 1
        - 1
        damage_decrease_step_percent: 1
        max_damage_decrease_apply_count: 6
        forced_direction: 7
        include_carried: true
        stop_at_target: true
        only_affect_in_sight_line: true
      properties:
        raw:
          description: Original compact zone encoding when the source provides one.
          type: string
        shape:
          $ref: "#/components/schemas/ZoneShape"
        size:
          description: Effective outer size of the area. A point has size 0. Whole-map
            and custom-cell shapes omit it.
          nullable: true
          type: integer
        min_size:
          description: Effective inner size for hollow or minimum-size shapes. Omitted
            when the shape has no inner boundary.
          nullable: true
          type: integer
        cell_ids:
          description: Explicit cells for a custom-cell shape. An empty array is normal
            for geometric shapes such as circles and does not mean the zone affects
            no cells.
          items:
            type: integer
          type: array
        damage_decrease_step_percent:
          type: integer
        max_damage_decrease_apply_count:
          type: integer
        forced_direction:
          type: integer
        include_carried:
          type: boolean
        stop_at_target:
          type: boolean
        only_affect_in_sight_line:
          type: boolean
      required:
      - cell_ids
      - shape
      type: object
    WeaponCombat:
      description: Weapon attack targeting and area geometry. Available for weapon
        equipment. This is separate from spell effect zones.
      example:
        zone:
          raw: raw
          shape:
            code: code
            name: name
          size: 7
          min_size: 1
          cell_ids:
          - 1
          - 1
          damage_decrease_step_percent: 1
          max_damage_decrease_apply_count: 6
          forced_direction: 7
          include_carried: true
          stop_at_target: true
          only_affect_in_sight_line: true
        cast_in_line: true
        cast_in_diagonal: true
        requires_line_of_sight: true
      properties:
        zone:
          $ref: "#/components/schemas/EffectZone"
        cast_in_line:
          type: boolean
        cast_in_diagonal:
          type: boolean
        requires_line_of_sight:
          type: boolean
      required:
      - cast_in_diagonal
      - cast_in_line
      - requires_line_of_sight
      - zone
      type: object
    SpellEffect:
      additionalProperties: true
      description: "One normal or critical effect of a particular spell grade. Its\
        \ zone defines where it applies, target_mask defines eligible targets and\
        \ triggers defines activation events. Templated text is for display, not a\
        \ formula to parse."
      example:
        type: type
        min: 5
        max: 6
        duration: 3
        delay: 3
        random: 7.143538047012306
        group: 0
        dispellable: 7
        effect_uid: 6
        target_id: 0
        triggered_duration: 4
        display_zero: true
        modifier: 8
        zone:
          raw: raw
          shape:
            code: code
