        name: game
        required: true
        schema:
          enum:
          - dofus3
          - dofus3beta
          example: dofus3
          type: string
        style: simple
      - description: case sensitive search query
        explode: true
        in: query
        name: query
        required: true
        schema:
          example: Des
          type: string
        style: form
