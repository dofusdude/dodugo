          example: 195
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: only results where the equipment with the highest level is below
          or equal to this value
        explode: true
        in: query
        name: "filter[max_highest_equipment_level]"
        required: false
        schema:
          example: 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: maximum number of returned results
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 8
          example: 8
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "filter sets based on if they only got cosmetic items in it.\
          \ If true, the item ids are for the cosmetic endpoints instead of equipment."
        explode: true
        in: query
        name: "filter[contains_cosmetics_only]"
        required: false
        schema:
          type: boolean
        style: form
      - description: filter sets based on if they got any cosmetic items in it
        explode: true
        in: query
        name: "filter[contains_cosmetics]"
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              examples: {}
              schema:
                items:
                  $ref: "#/components/schemas/ListEquipmentSet"
                type: array
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
      summary: Search Sets
      tags:
      - sets
      x-stoplight:
        id: 7pwfbuzuxnnuq
