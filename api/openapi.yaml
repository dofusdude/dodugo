  /{game}/v1/{language}/search:
    get:
      description: Search in all names and descriptions of all supported types in
        the game. For the list of supported types see the endpoint /dofus3/meta/search/types.
      operationId: get-game-search
      parameters:
      - description: a valid language code
        explode: false
        in: path
        name: language
        required: true
        schema:
          enum:
          - en
          - fr
          - de
          - es
          - pt
          maxLength: 2
          minLength: 2
          type: string
        style: simple
      - description: game main 'dofus3' or beta channel 'dofus3beta'
        explode: false
        in: path
        name: game
        required: true
        schema:
          enum:
          - dofus3
          - dofus3beta
          example: dofus3
          type: string
        style: simple
      - description: search query
        explode: true
        in: query
        name: query
        required: true
        schema:
          example: paztek
          type: string
        style: form
      - description: only results with all specific type
        explode: false
        in: query
        name: "filter[search_index]"
        required: false
        schema:
          example:
          - items-equipment
          items:
            enum:
            - items-consumables
            - items-cosmetics
            - items-resources
            - items-equipment
            - items-quest_items
            - mounts
            - sets
            type: string
          type: array
          uniqueItems: true
        style: form
      - description: maximum number of returned results
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 8
          example: 8
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: adds fields from the item search to the list entries if the hit
          is an item. Multiple comma separated values allowed.
        explode: false
        in: query
        name: "fields[item]"
        required: false
        schema:
          example:
          - level
          items:
            enum:
            - level
            - image_urls
            - type
            type: string
          type: array
          uniqueItems: true
        style: form
      - description: "multi-filter results with the english item type name, including\
          \ \"mount\" and \"set\" from filter[search_index]. Add with \"wood\" or\
          \ \"+wood\" and exclude with \"-wood\"."
        explode: false
        in: query
        name: "filter[type.name_id]"
        required: false
        schema:
          example:
          - boots
          items:
            type: string
          type: array
          uniqueItems: true
        style: form
      responses:
        "200":
          content:
            application/json:
              examples: {}
              schema:
                items:
                  $ref: "#/components/schemas/GameSearch"
                type: array
                x-examples:
                  Example 1:
                  - name: Paztek Sandals
                    ankama_id: 20463
                    type: items-equipment
                  - name: Paztek Mask
                    ankama_id: 20465
                    type: items-equipment
                  - name: Paztek Cloak
                    ankama_id: 20464
                    type: items-equipment
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
      summary: Game Search
      tags:
      - game
      x-stoplight:
        id: zxx3tt0z25gz8
